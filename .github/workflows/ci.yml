name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle: appimage
          - os: windows-latest
            bundle: msi
          - os: macos-latest
            bundle: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb dbus-x11 at-spi2-core
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm -C app install --frozen-lockfile
      - name: Install Rust and validation components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace
      - name: Validate frontend
        run: pnpm -C app lint && pnpm -C app test && pnpm -C app build
      - name: Validate visual evaluation page offline with synthetic answers
        run: node scripts/check-visual-page.mjs
      - name: Build offline desktop application
        run: pnpm -C app tauri build --ci --bundles ${{ matrix.bundle }}
      - name: Package with the operating system WebView
        if: runner.os == 'Linux'
        run: bash scripts/lean-appimage.sh
      - name: Smoke test the Linux application
        if: runner.os == 'Linux'
        run: bash scripts/smoke-appimage.sh
      - name: Measure installer size
        run: node scripts/check-installers.mjs
      - name: Retain installers and measured sizes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.AppImage
            target/release/bundle/installer-sizes.json
            target/release/bundle/appimage/*.txt
            target/release/bundle/appimage/*.sha256
      - name: Check portable core
        run: cargo check -p av-core --target wasm32-unknown-unknown
      - name: Install license checker
        run: cargo install cargo-deny --locked
      - name: Check dependency licenses
        run: cargo deny check licenses
      - name: Audit isolated fuzz dependencies
        if: runner.os == 'Linux'
        run: cargo deny --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml check licenses

  quality:
    name: Minimal corpus quality regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Measure the versioned corpus and enforce fidelity/topology limits
        run: cargo run -p av-bench --release -- run --config logo --label ci --check-baseline corpus/baselines/metrics.json
      - name: Validate opt-in composition on the complete categorized corpus
        run: |
          cargo run -p av-bench --release -- run --config corpus --opaque-canvas --label ci-opaque-canvas --check-baseline corpus/baselines/quality/f9/metrics.json
          cargo run -p av-bench --release -- gate-quality bench-out/ci-opaque-canvas/metrics.json corpus/baselines/quality/f9/vtracer.json
          cargo run -p av-bench --release -- gate-curves bench-out/ci-opaque-canvas/metrics.json corpus/baselines/quality/f9/vtracer.json
      - name: Retain measured metrics, SVGs, renders and difference maps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: |
            bench-out/ci/
            bench-out/ci-opaque-canvas/

  profile:
    name: CPU flamegraph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install sampling tools
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-generic
          cargo install flamegraph --version 0.6.14 --locked
      - name: Profile the original 4MP illustration reference
        env:
          CARGO_PROFILE_RELEASE_DEBUG: 1
          RUSTFLAGS: -Clink-arg=-Wl,--no-rosegment
          RAYON_NUM_THREADS: 8
        run: |
          export PERF=$(find -L /usr/lib/linux-tools -type f -name perf | sort -V | tail -n 1)
          test -n "$PERF" && test -x "$PERF"
          mkdir -p bench-out/profile
          cargo flamegraph --root -p av-bench --output bench-out/profile/illustration.svg -- profile corpus/baselines/performance/f9/before/illustration-4mp-32.png --opaque-canvas
      - name: Retain measured CPU profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-profile
          path: bench-out/profile/
