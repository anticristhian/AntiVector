name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm -C app install --frozen-lockfile
      - name: Install Rust and validation components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace
      - name: Validate frontend
        run: pnpm -C app lint && pnpm -C app test && pnpm -C app build
      - name: Build offline desktop application
        run: pnpm -C app tauri build --no-bundle
      - name: Check portable core
        run: cargo check -p av-core --target wasm32-unknown-unknown
      - name: Install license checker
        run: cargo install cargo-deny --locked
      - name: Check dependency licenses
        run: cargo deny check licenses

  quality:
    name: Minimal corpus quality regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Measure the versioned corpus and enforce fidelity/topology limits
        run: cargo run -p av-bench --release -- run --config logo --label ci --check-baseline corpus/baselines/metrics.json
      - name: Retain measured metrics, SVGs, renders and difference maps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: bench-out/ci/
