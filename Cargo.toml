[workspace]
members = [
    "crates/av-core",
    "crates/av-export",
    "crates/av-metrics",
    "crates/av-session",
    "crates/av-cli",
    "crates/av-bench",
    "app/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
