[package]
name = "av-session"
description = "Vectorization sessions, stage cache, edits and jobs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
av-core = {path="../av-core"}
serde = {version="1",features=["derive"]}
image = {version="0.25",default-features=false,features=["png","jpeg","bmp","gif","tiff","webp"]}
serde_json = "1"
zip = { version = "9.1", default-features = false }
tempfile = "3"

[dev-dependencies]
av-export = {path="../av-export"}

[lints]
workspace = true
