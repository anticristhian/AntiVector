[licenses]
include-dev = true
confidence-threshold = 0.95
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
]

# The unpublished workspace has no distribution license selected yet.
# Third-party dependencies remain subject to the allowlist above.
[licenses.private]
ignore = true

# ADR-012: build-only target metadata, not a blanket license allowance.
[[licenses.exceptions]]
name = "target-lexicon"
version = "=0.12.16"
allow = ["Apache-2.0 WITH LLVM-exception"]

# ADR-013: native Windows clipboard dependencies, exact audited versions.
[[licenses.exceptions]]
name = "clipboard-win"
version = "=5.4.3"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
name = "error-code"
version = "=3.4.0"
allow = ["BSL-1.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
